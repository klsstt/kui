<!DOCTYPE HTML>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit|ie-comp|ie-stand">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-siteapp" />
    <link rel="Bookmark" href="../favicon.ico">
    <!--[if lt IE 9]>
    <script type="text/javascript" src="lib/html5.js"></script>
    <script type="text/javascript" src="lib/respond.min.js"></script>
    <![endif]-->
    <title>KUI - 轻量级扁平化响应式 UI 框架</title>
    <meta name="keywords" content="KUI ADMIN，网站后台模版，上手简单，扩展方便，为企业级平台提供高效解决方案！">
    <meta name="description" content="KUI，是一款轻量级扁平化响应式 UI 框架。基于 Vite 5 构建，支持 Design Token、暗黑模式、可访问性。">
    
    <!-- 主题初始化 -->
    <script src="./js/common/theme.js"></script>
    
    <link rel="stylesheet" href="css/kui.css">
    <link rel="stylesheet" href="fonts/font-awesome-4.7/font-awesome.min.css">
    <link rel="stylesheet" href="skin/default/skin.css" id="skin">
    <link rel="stylesheet" href="css/example.css">

</head>

<body>
    <!-- 隐藏的关于对话框 -->
    <div id="div_about" style="display:none;">
        <div style="padding: 20px; text-align: center;">
            <h2>KUI 通用管理系统</h2>
            <p>版本：v2.0.0</p>
            <p>基于 jQuery 的轻量级响应式 UI 框架</p>
        </div>
    </div>
    
    <!-- 隐藏的 KTab 容器 -->
    <div id="ktab" style="display:none;"></div>
    
    <!-- 数据容器 - 用于模板渲染 -->
    <div id="data" style="display:none;"></div>
    
    <header class="navbar navbar-default navbar-fixed-top"></header>
    <div class="kui-ktabs-open">
        <!--_menu 作为公共模版分离出去-->
        <menu class="kui-tree-menu">
            <nav class="menu">
                <ul class="tree tree-menu" id="kui-tree-menu"></ul>
            </nav>
            <div class="kui-tree-menu-arrow">
                <a class="kui-tree-menu-arrow-a" href="javascript:void(0);"></a>
            </div>
        </menu>
        <!--/_menu 作为公共模版分离出去-->

        <nav class="kui-ktabs">
            <button type="button" class="btn btn-icon btn-default pull-left hidden-lg">
                <i class="fa fa-angle-double-left"></i>
            </button>
            <div class="contabs-scroll">
                <ul class="con-tabs" id="kui-knav">
                    <!-- 标签页将通过 JavaScript 动态生成 -->
                </ul>
            </div>
            <div class="kui-ktool">
                <span class="kui-krefresh" title="刷新当前选项卡"><i class="fa fa-refresh"></i></span>
                <span class="kui-kclose" title="关闭当前选项卡"><i class="fa fa-remove"></i></span>
            </div>
        </nav>

        <section class="kui-container">
            <!-- 主要内容区域 - iframe 容器 -->
            <div class="kui-main" id="kui-main">
                <iframe name="iframe-0" class="page-frame animation-fade active" src="home.html" frameborder="0"></iframe>
            </div>
        </section>
    </div>

    <!-- 引入 jQuery -->
    <script type="text/javascript" src="./lib/jquery/1.9.1/jquery.min.js"></script>
    <script type="text/javascript" src="./js/kui.js"></script>
    <script type="text/javascript" src="./js/kui.ktab.iframe.js"></script>
    <script type="text/javascript" src="./js/kui.ktab.pjax.js"></script>
    <script type="text/javascript" src="./lib/art-template/template-web.js"></script>
    <script type="text/javascript" src="./lib/layer/2.4/layer.js"></script>
    <script type="text/javascript" src="./lib/layer.date/laydate.js"></script>
    <script type="text/javascript" src="./js/example.js"></script>
</body>
</html>
