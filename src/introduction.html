<!DOCTYPE HTML>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="renderer" content="webkit|ie-comp|ie-stand">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-siteapp" />
    <link rel="Bookmark" href="favicon.ico">
    <!--[if lt IE 9]>
    <script type="text/javascript" src="lib/html5.js"></script>
    <script type="text/javascript" src="lib/respond.min.js"></script>
    <![endif]-->
    <title>KUI - 产品介绍</title>
    <meta name="keywords" content="KUI ADMIN，网站后台模版，上手简单，扩展方便，为企业级平台提供高效解决方案！">
    <meta name="description" content="KUI，是一款轻量级扁平化响应式 UI 框架。">
    
    <link rel="stylesheet" href="css/kui.css">
    <link rel="stylesheet" href="fonts/font-awesome-4.7/font-awesome.min.css">
    <link rel="stylesheet" href="skin/default/skin.css">
    
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: "Helvetica Neue", Helvetica, Tahoma, Arial, "Microsoft Yahei", sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            background-color: #fff;
        }
        
        .container-fluid {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .hero-section {
            text-align: center;
            padding: 60px 0;
            margin-bottom: 40px;
        }
        
        .hero-title {
            margin: 0;
            font-size: 36px;
            font-weight: 700;
            color: #1890ff;
            margin-bottom: 20px;
        }
        
        .hero-subtitle {
            font-size: 18px;
            color: #666;
            max-width: 800px;
            margin: 0 auto 40px;
            line-height: 1.8;
        }
        
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }
        
        .feature-card {
            padding: 30px;
            background-color: #fff;
            border: 1px solid #e8e8e8;
            border-radius: 6px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            border-color: #1890ff;
        }
        
        .feature-icon {
            font-size: 48px;
            margin-bottom: 20px;
            color: #1890ff;
        }
        
        .feature-title {
            margin: 20px 0 15px;
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }
        
        .feature-description {
            font-size: 14px;
            color: #666;
            line-height: 1.8;
            margin: 0;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            
            .hero-title {
                font-size: 28px;
            }
            
            .features-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <section class="hero-section">
            <h1 class="hero-title">🚀 KUI 通用管理系统</h1>
            <p class="hero-subtitle">
                基于 Bootstrap 3 优化改进的轻量级扁平化响应式 UI 框架<br>
                现已升级至 Vite 5 构建系统，支持 Design Token 和暗黑模式
            </p>
        </section>
        
        <section class="features-grid">
            <div class="feature-card">
                <div class="feature-icon">
                    <i class="fa fa-code"></i>
                </div>
                <h3 class="feature-title">免费开源</h3>
                <p class="feature-description">在 MIT 开源协议下完全免费使用，代码透明，社区驱动。</p>
            </div>
            
            <div class="feature-card">
                <div class="feature-icon">
                    <i class="fa fa-bolt"></i>
                </div>
                <h3 class="feature-title">快速开发</h3>
                <p class="feature-description">丰富的组件库和模板，开箱即用，大幅提升开发效率。</p>
            </div>
            
            <div class="feature-card">
                <div class="feature-icon">
                    <i class="fa fa-mobile"></i>
                </div>
                <h3 class="feature-title">响应式设计</h3>
                <p class="feature-description">完美适配 PC、平板、手机等各种设备，一次开发多端适用。</p>
            </div>
            
            <div class="feature-card">
                <div class="feature-icon">
                    <i class="fa fa-paint-brush"></i>
                </div>
                <h3 class="feature-title">多主题支持</h3>
                <p class="feature-description">内置多种配色方案，支持一键切换暗黑模式。</p>
            </div>
            
            <div class="feature-card">
                <div class="feature-icon">
                    <i class="fa fa-plug"></i>
                </div>
                <h3 class="feature-title">插件丰富</h3>
                <p class="feature-description">集成 zTree、UEditor、ECharts 等大量第三方优质插件。</p>
            </div>
            
            <div class="feature-card">
                <div class="feature-icon">
                    <i class="fa fa-book"></i>
                </div>
                <h3 class="feature-title">文档完善</h3>
                <p class="feature-description">详细的使用文档和示例代码，快速上手无门槛。</p>
            </div>
        </section>
    </div>
    
    <!-- 引入 jQuery -->
    <script type="text/javascript" src="./lib/jquery/1.9.1/jquery.min.js"></script>
    <script type="text/javascript" src="./js/kui.js"></script>
    
    <script>
        $(document).ready(function() {
            console.log('✅ 产品介绍页面已加载');
        });
    </script>
</body>
</html>
